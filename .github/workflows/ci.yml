# Continuous integration. NOT yet run on a real repository (none exists yet): treat as a starting point and watch the first run.
name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build          # also runs the secret audit on the browser bundle (postbuild)
      - name: Install Chrome for the browser tests
        uses: browser-actions/setup-chrome@v1
      - run: npm run e2e            # builds and starts the production server itself
        env: { CI: "true" }
